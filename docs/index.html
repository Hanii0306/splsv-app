6 = -14",prompt:["Pernyataan: Penyelesaian 4x + 6 = −14 adalah x = −2."],boxes:[{text:"Pilihan:",choices:["Benar","Salah"],answer:1},{text:"Penyelesaian yang tepat: x = □",answer:"-5"}],clue:"Substitusikan x = −2. Apakah ruas kiri menjadi −14?",step:"Untuk nilai yang benar: kurangi 6 di kedua ruas, lalu bagi 4.",steps:["Tafsirkan klaim: x = −2 memenuhi 4x + 6 = −14.","Uji: 4(−2) + 6 = −2 ≠ −14.","Langkah benar: 4x = −14 − 6 = −20 → x = −5.","Isian: x = −5.",'Pilih "Salah": yang dihitung keliru −14 + 6 = −8.',"Jadi, pernyataan salah dan x = −5."],var:"x"},{id:"L3-10",kind:"steps",ind:"reason",label:"Isian Nilai Bentuk",eq:"3x - 4 = 11",prompt:["Diketahui persamaan 3x − 4 = 11."],boxes:[{text:"Nilai x = □",answer:"5"},{text:"Nilai dari 2x + 7 = □",answer:"17"}],clue:"Cari x lebih dulu, baru hitung 2x + 7.",step:"Tambah 4 lalu bagi 3 untuk x. Substitusikan ke 2x + 7.",steps:["x dicari dulu sebelum menghitung 2x + 7.","3x = 15 → x = 5, lalu 2(5) + 7 = 17.","Periksa: 3(5) − 4 = 11.","Isian: x = 5 dan 2x + 7 = 17.","Nilai variabel pada persamaan linear bersifat tunggal."],var:"x"}]},{id:"L4",code:"K-04",title:"Kasus Jejak Ganda Pelaku",form:"ax + b = cx + d",badge:"Trail Tracker",briefing:["Pelaku meninggalkan jejak x di dua tempat.","Kumpulkan semua jejak x di satu ruas."],twin:["Contoh sejenis: 3x + 1 = x + 7","Kurangi kedua ruas dengan x: 2x + 1 = 7","Kurangi kedua ruas dengan 1: 2x = 6","Bagi kedua ruas dengan 2: x = 3"],items:[{id:"L4-01",kind:"mc",ind:"employ",label:"Pengelompokan Suku",eq:"5x - 4 = 2x + 11",prompt:["Nilai x yang memenuhi 5x − 4 = 2x + 11 adalah ...."],options:["3","5","7","15"],answer:1,clue:"Ada x di kedua ruas. Bagaimana mengumpulkannya di satu ruas?",step:"Kurangi 2x dan tambah 4 pada kedua ruas: 5x − 2x = 11 + 4.",steps:["Diketahui 5x − 4 = 2x + 11.","Kurangi 2x dan tambah 4 pada kedua ruas: 5x − 2x = 11 + 4.","3x = 15 → x = 5.","Jadi, jawabannya B (5)."],var:"x"},{id:"L4-02",kind:"mc",ind:"employ",label:"Koefisien Kiri Lebih Kecil",eq:"3x + 10 = 7x - 6",prompt:["Penyelesaian dari 3p + 10 = 7p − 6 adalah ...."],options:["p = −4","p = −1","p = 1","p = 4"],answer:3,clue:"Suku p mana yang dikurangkan dari kedua ruas?",step:"Kurangi 7p dan 10 pada kedua ruas: 3p − 7p = −6 − 10.",steps:["Diketahui 3p + 10 = 7p − 6.","Kurangi 7p dan 10 pada kedua ruas: 3p − 7p = −6 − 10.","−4p = −16 → p = 4.","Jadi, jawabannya D (p = 4)."],var:"p"},{id:"L4-03",kind:"mc",ind:"employ",label:"Solusi Negatif",eq:"8x + 3 = 5x - 12",prompt:["Nilai y yang memenuhi 8y + 3 = 5y − 12 adalah ...."],options:["−5","−3","3","5"],answer:0,clue:"Kumpulkan suku y di kiri dan bilangan di kanan.",step:"Kurangi 5y dan 3 pada kedua ruas: 8y − 5y = −12 − 3.",steps:["Diketahui 8y + 3 = 5y − 12.","Kurangi 5y dan 3 pada kedua ruas: 8y − 5y = −12 − 3.","3y = −15 → y = −5.","Jadi, jawabannya A (−5)."],var:"y"},{id:"L4-04",kind:"mc",ind:"employ",label:"Koefisien Satu",eq:"4x - 9 = x + 12",prompt:["Jika 4m − 9 = m + 12, maka nilai m adalah ...."],options:["1","3","7","21"],answer:2,clue:"Ingat, m sama dengan 1m. Kurangkan dari kedua ruas.",step:"Kurangi m dan tambah 9 pada kedua ruas: 4m − m = 12 + 9.",steps:["Diketahui 4m − 9 = m + 12 (m = 1m).","Kurangi m dan tambah 9 pada kedua ruas: 4m − m = 12 + 9.","3m = 21 → m = 7.","Jadi, jawabannya C (7)."],var:"m"},{id:"L4-05",kind:"mc",ind:"employ",label:"Variabel Bertanda Negatif",eq:"15 - 2x = 3x - 10",prompt:["Penyelesaian dari 15 − 2x = 3x − 10 adalah ...."],options:["x = −5","x = 1","x = 5","x = 25"],answer:2,clue:"Suku −2x ikut tandanya. Ke mana x dikumpulkan?",step:"Kurangi 3x dan 15 pada kedua ruas: −2x − 3x = −10 − 15.",steps:["Diketahui 15 − 2x = 3x − 10.","Kurangi 3x dan 15 pada kedua ruas: −2x − 3x = −10 − 15.","−5x = −25 → x = 5.","Jadi, jawabannya C (x = 5)."],var:"x"},{id:"L4-06",kind:"mc",ind:"employ",label:"Solusi Nol",eq:"9x - 14 = 4x - 14",prompt:["Nilai k yang memenuhi 9k − 14 = 4k − 14 adalah ...."],options:["−28","−5","0","5"],answer:2,clue:"Kumpulkan suku k. Berapa sisa bilangan di ruas kanan?",step:"Kurangi 4k dan tambah 14 pada kedua ruas: 9k − 4k = −14 + 14.",steps:["Diketahui 9k − 14 = 4k − 14.","Kurangi 4k dan tambah 14 pada kedua ruas: 9k − 4k = −14 + 14.","5k = 0 → k = 0.","Jadi, jawabannya C (0)."],var:"k"},{id:"L4-07",kind:"steps",ind:"employ",label:"Isian Bertahap",eq:"7x - 8 = 3x + 12",prompt:["Selesaikan 7x − 8 = 3x + 12 pada aplikasi:"],boxes:[{text:"Kumpulkan variabel di kiri: □x − □x = 12 + 8",answer:["7","3"]},{text:"Hasil akhir: x = □",answer:"5"}],clue:"Suku x apa saja yang ada? Kurangkan 3x dari kedua ruas.",step:"Kurangi 3x dan tambah 8 pada kedua ruas, lalu bagi 4.",steps:["Suku variabel: 7x dan 3x (kotak 7 dan 3).","Sederhanakan: 4x = 20.","Bagi kedua ruas dengan 4: x = 5.","Jadi, x = 5."],var:"x"},{id:"L4-08",kind:"steps",ind:"reason",label:"Isian Pembuktian",eq:"6x - 3 = 4x + 9",prompt:["Diketahui persamaan 6x − 3 = 4x + 9."],boxes:[{text:"Nilai x yang memenuhi adalah: □",answer:"6"},{text:"Nilai kedua ruas saat x disubstitusikan adalah: □",answer:"33"}],clue:"Solusi membuat ruas kiri sama dengan ruas kanan.",step:"Kurangi 4x dan tambah 3 pada kedua ruas. Lalu hitung 6x − 3.",steps:["Solusi membuat nilai ruas kiri = ruas kanan.","2x = 12 → x = 6; ruas kiri 6(6) − 3 = 33.","Ruas kanan 4(6) + 9 = 33 (terbukti sama).","Isian: x = 6 dan nilai ruas = 33.","x = 6 valid karena kedua ruas bernilai 33."],var:"x"},{id:"L4-09",kind:"steps",ind:"interpret",label:"Benar/Salah + Isian",eq:"2x + 15 = 5x - 3",prompt:["Pernyataan: Nilai x yang memenuhi 2x + 15 = 5x − 3 adalah x = 4."],boxes:[{text:"Pilihan:",choices:["Benar","Salah"],answer:1},{text:"Nilai x yang benar adalah: □",answer:"6"}],clue:"Hitung kedua ruas saat x = 4. Apakah sama?",step:"Kurangi 5x dan 15 pada kedua ruas: 2x − 5x = −3 − 15.",steps:["Tafsirkan klaim x = 4.","Uji: kiri 2(4) + 15 = 23, kanan 5(4) − 3 = 17 (23 ≠ 17).","Benar: −3x = −18 → x = 6.","Isian x yang benar = 6.",'Pilih "Salah" karena kedua ruas tidak sama.',"Jadi, pernyataan salah dan x = 6."],var:"x"},{id:"L4-10",kind:"steps",ind:"formulate",label:"Isian Singkat",eq:"10x + 7 = 6x - 13",prompt:["Tentukan nilai a yang memenuhi 10a + 7 = 6a − 13!"],boxes:[{text:"Jawaban: a = □",answer:"-5"}],clue:"Kenali suku variabel (10a, 6a) dan konstanta (7, −13).",step:"Kurangi 6a dan 7 pada kedua ruas, lalu bagi.",steps:["Diketahui 10a + 7 = 6a − 13.","Suku variabel 10a, 6a; konstanta 7, −13.","10a − 6a = −13 − 7.","4a = −20.","Bagi kedua ruas dengan 4: a = −5.","Jadi, a = −5."],var:"a"}]},{id:"L5",code:"K-05",title:"Kasus Enkripsi Berlapis",form:"a(bx + c) = d",badge:"Layer Decoder",briefing:["Kode dilindungi lapisan tanda kurung.","Buka lapisannya dengan sifat distributif, lalu selesaikan."],twin:["Contoh sejenis: 2(x + 3) = 14","Jabarkan: 2 · x + 2 · 3 → 2x + 6 = 14","Kurangi 6 di kedua ruas: 2x = 8 → x = 4"],items:[{id:"L5-01",kind:"mc",ind:"employ",label:"Kurung Tunggal",eq:"3(x + 4) = 27",prompt:["Nilai x yang memenuhi persamaan 3(x + 4) = 27 adalah ...."],options:["5","7","9","11"],answer:0,clue:"Ada tanda kurung. Apa yang dibereskan lebih dulu?",step:"Jabarkan: 3 · x + 3 · 4 → 3x + 12 = 27.",steps:["Diketahui 3(x + 4) = 27.","Jabarkan kurung (distributif): 3x + 12 = 27.","3x = 27 − 12 = 15 → x = 5.","Jadi, jawabannya A (5)."],var:"x"},{id:"L5-02",kind:"mc",ind:"employ",label:"Kurung di Kedua Ruas",eq:"2(3x - 5) = 4(x + 1)",prompt:["Penyelesaian dari 2(3y − 5) = 4(y + 1) adalah ...."],options:["y = 3","y = 5","y = 7","y = 14"],answer:2,clue:"Ada dua kurung. Jabarkan keduanya lebih dulu.",step:"Jabarkan kedua kurung: 6y − 10 = 4y + 4.",steps:["Diketahui 2(3y − 5) = 4(y + 1).","Jabarkan: 6y − 10 = 4y + 4.","Kurangi 4y, tambah 10: 2y = 14 → y = 7.","Jadi, jawabannya C (y = 7)."],var:"y"},{id:"L5-03",kind:"mc",ind:"employ",label:"Koefisien dalam Kurung",eq:"5(2x - 1) = 35",prompt:["Nilai m yang memenuhi 5(2m − 1) = 35 adalah ...."],options:["3","4","5","8"],answer:1,clue:"Kalikan 5 ke setiap suku di dalam kurung.",step:"Jabarkan: 10m − 5 = 35.",steps:["Diketahui 5(2m − 1) = 35.","Jabarkan: 10m − 5 = 35.","10m = 40 → m = 4.","Jadi, jawabannya B (4)."],var:"m"},{id:"L5-04",kind:"mc",ind:"employ",label:"Pengali Negatif",eq:"-2(x - 6) = 18",prompt:["Jika −2(x − 6) = 18, maka nilai x adalah ...."],options:["−15","−3","3","15"],answer:1,clue:"Pengalinya negatif. Berapa (−2) × (−6)?",step:"Jabarkan hati-hati: −2x + 12 = 18.",steps:["Diketahui −2(x − 6) = 18.","Jabarkan: −2x + 12 = 18.","−2x = 18 − 12 = 6 → x = −3.","Jadi, jawabannya B (−3)."],var:"x"},{id:"L5-05",kind:"mc",ind:"employ",label:"Dua Kurung Penjumlahan",eq:"4(x + 3) = 2(x + 10)",prompt:["Penyelesaian dari 4(p + 3) = 2(p + 10) adalah ...."],options:["p = 4","p = 6","p = 8","p = 16"],answer:0,clue:"Jabarkan kedua kurung, lalu kumpulkan suku p.",step:"Jabarkan: 4p + 12 = 2p + 20.",steps:["Diketahui 4(p + 3) = 2(p + 10).","Jabarkan: 4p + 12 = 2p + 20.","Kurangi 2p dan 12: 2p = 8 → p = 4.","Jadi, jawabannya A (p = 4)."],var:"p"},{id:"L5-06",kind:"mc",ind:"employ",label:"Kurung + Konstanta Luar",eq:"3(2x + 1) - 5 = 16",prompt:["Nilai x yang memenuhi 3(2x + 1) − 5 = 16 adalah ...."],options:["2","3","4","6"],answer:1,clue:"Jabarkan kurung, lalu gabungkan bilangan di ruas kiri.",step:"6x + 3 − 5 = 16 → 6x − 2 = 16.",steps:["Diketahui 3(2x + 1) − 5 = 16.","Jabarkan dan gabung: 6x + 3 − 5 = 16 → 6x − 2 = 16.","6x = 18 → x = 3.","Jadi, jawabannya B (3)."],var:"x"},{id:"L5-07",kind:"steps",ind:"employ",label:"Isian Jabaran Kurung",eq:"4(2x - 3) = 20",prompt:["Jabarkan lalu selesaikan: 4(2x − 3) = 20"],boxes:[{text:"Hasil jabaran kurung: □x − □ = 20",answer:["8","12"]},{text:"Nilai x = □",answer:"4"}],clue:"Kalikan 4 dengan 2x, lalu 4 dengan −3.",step:"8x − 12 = 20. Tambah 12, lalu bagi 8.",steps:["4 × 2x = 8x (kotak 8).","4 × (−3) = −12 (kotak 12).","8x − 12 = 20 → 8x = 32 → x = 4.","Jadi, x = 4."],var:"x"},{id:"L5-08",kind:"steps",ind:"formulate",label:"Isian Bertahap",eq:"5(x - 2) = 3(x + 4)",prompt:["Selesaikan persamaan 5(x − 2) = 3(x + 4):"],boxes:[{text:"Jabaran kurung: 5x − □ = 3x + □",answer:["10","12"]},{text:"Nilai x = □",answer:"11"}],clue:"Pengali ruas kiri 5, ruas kanan 3. Kalikan ke dalam kurung.",step:"Kurangi 3x dan tambah 10 pada kedua ruas: 5x − 3x = 12 + 10.",steps:["Diketahui 5(x − 2) = 3(x + 4).","Pengali: kiri 5, kanan 3.","Ruas kiri: 5x − 10.","Ruas kanan: 3x + 12.","5x − 3x = 12 + 10 → 2x = 22.","x = 11."],var:"x"},{id:"L5-09",kind:"steps",ind:"interpret",label:"Benar/Salah + Isian",eq:"-3(x - 4) = 21",prompt:["Pernyataan: Jabaran dari −3(x − 4) adalah −3x − 12."],boxes:[{text:"Pilihan:",choices:["Benar","Salah"],answer:1},{text:"Jika −3(x − 4) = 21, maka nilai x = □",answer:"-3"}],clue:"Periksa perkalian tanda: negatif kali negatif hasilnya apa?",step:"Jabaran yang benar −3x + 12 = 21. Kurangi 12, lalu bagi −3.",steps:["Tafsirkan klaim: −3(x − 4) = −3x − 12.","(−3) × (−4) = +12, bukan −12.","−3x + 12 = 21 → −3x = 9 → x = −3.","Isian x = −3.",'Pilih "Salah": negatif kali negatif hasilnya positif.',"Jabaran benar: −3x + 12, dan x = −3."],var:"x"},{id:"L5-10",kind:"steps",ind:"reason",label:"Isian Singkat",eq:"6(x + 2) = 3(3x - 1)",prompt:["Tentukan nilai y yang memenuhi 6(y + 2) = 3(3y − 1)!"],boxes:[{text:"Jawaban: y = □",answer:"5"}],clue:"Jabarkan langsung, atau bagi kedua ruas dengan 3 dulu.",step:"Kurangi 9y dan 12 pada kedua ruas: −3y = −15.",steps:["Kedua ruas punya faktor 3, atau bisa langsung dijabarkan.","Cara 1: 6y + 12 = 9y − 3 → −3y = −15 → y = 5.","Cara 2: bagi 3 dulu: 2y + 4 = 3y − 1 → y = 5.","Jawaban y = 5.","Kedua strategi menghasilkan y = 5."],var:"y"}]},{id:"L6",code:"K-06",title:"Kasus Kode Pecahan Rusak",form:"pecahan",badge:"Fraction Fixer",briefing:["Kode rusak berisi pecahan.","Kita perbaiki pelan-pelan: hilangkan penyebut dengan mengalikan kedua ruas."],twin:["Contoh sejenis: x/3 + 1 = 5","Kalikan kedua ruas dengan 3: x + 3 = 15","Kurangi 3 di kedua ruas: x = 12"],items:[{id:"L6-01",kind:"mc",ind:"employ",label:"Pecahan Tunggal",eq:"x/4 = 6",prompt:["Nilai x yang memenuhi persamaan x/4 = 6 adalah ...."],options:["2","10","24","32"],answer:2,clue:"x dibagi 4. Operasi apa yang membatalkan pembagian?",step:"Kalikan kedua ruas dengan 4: (x/4) × 4 = 6 × 4.",steps:["Diketahui x/4 = 6.","Kalikan kedua ruas dengan 4: (x/4) × 4 = 6 × 4.","Diperoleh x = 24.","Jadi, jawabannya C (24)."],var:"x"},{id:"L6-02",kind:"mc",ind:"employ",label:"Pecahan Negatif",eq:"-x/5 = 3",prompt:["Penyelesaian dari −y/5 = 3 adalah ...."],options:["y = −15","y = −8","y = 8","y = 15"],answer:0,clue:"−y/5 berarti y dikali −1/5. Kalikan kedua ruas dengan apa?",step:"Kalikan kedua ruas dengan −5: y = 3 × (−5).",steps:["Diketahui −y/5 = 3.","Kalikan kedua ruas dengan −5: y = 3 × (−5).","Diperoleh y = −15.","Jadi, jawabannya A (y = −15)."],var:"y"},{id:"L6-03",kind:"mc",ind:"employ",label:"Koefisien Pecahan",eq:"(3/4)x = 12",prompt:["Nilai p yang memenuhi (3/4)p = 12 adalah ...."],options:["9","15","16","36"],answer:2,clue:"Koefisien p adalah 3/4. Apa kebalikan pecahannya?",step:"Kalikan kedua ruas dengan 4/3: p = 12 × (4/3).",steps:["Diketahui (3/4)p = 12.","Kalikan kedua ruas dengan kebalikan 4/3: p = 12 × (4/3).","p = (12 : 3) × 4 = 16.","Jadi, jawabannya C (16)."],var:"p"},{id:"L6-04",kind:"mc",ind:"employ",label:"Pecahan + Konstanta",eq:"(2/3)x + 4 = 10",prompt:["Penyelesaian dari (2/3)x + 4 = 10 adalah ...."],options:["x = 4","x = 6","x = 9","x = 12"],answer:2,clue:"Hapus + 4 dulu, baru urus pecahannya.",step:"Kurangi 4 pada kedua ruas: (2/3)x = 6.",steps:["Diketahui (2/3)x + 4 = 10.","Kurangi 4 dulu: (2/3)x = 6.","Kalikan kedua ruas dengan 3/2: x = 6 × (3/2) = 9.","Jadi, jawabannya C (x = 9)."],var:"x"},{id:"L6-05",kind:"mc",ind:"employ",label:"Pembilang Aljabar",eq:"(x + 3)/2 = 7",prompt:["Nilai x yang memenuhi (x + 3)/2 = 7 adalah ...."],options:["4","11","14","17"],answer:1,clue:"Seluruh (x + 3) dibagi 2. Hilangkan penyebutnya dulu.",step:"Kalikan kedua ruas dengan 2: x + 3 = 14.",steps:["Diketahui (x + 3)/2 = 7.","Kalikan kedua ruas dengan 2: x + 3 = 14.","Kurangi 3 pada kedua ruas: x = 11.","Jadi, jawabannya B (11)."],var:"x"},{id:"L6-06",kind:"mc",ind:"employ",label:"Dua Pecahan",eq:"x/2 + x/4 = 9",prompt:["Penyelesaian dari (x/2) + (x/4) = 9 adalah ...."],options:["x = 6","x = 12","x = 18","x = 36"],answer:1,clue:"Penyebutnya 2 dan 4. Berapa KPK-nya?",step:"Kalikan semua suku dengan KPK 4: 2x + x = 36.",steps:["Diketahui x/2 + x/4 = 9, KPK penyebut = 4.","Kalikan semua suku dengan 4: 2x + x = 36.","3x = 36 → x = 12.","Jadi, jawabannya B (x = 12)."],var:"x"},{id:"L6-07",kind:"steps",ind:"employ",label:"Isian Bertahap",eq:"(1/5)x - 2 = 4",prompt:["Selesaikan persamaan (1/5)x − 2 = 4:"],boxes:[{text:"Langkah 1: (1/5)x = □",answer:"6"},{text:"Langkah 2: Nilai x = □",answer:"30"}],clue:"Hapus − 2 dulu dari kedua ruas.",step:"Tambah 2 pada kedua ruas, lalu kalikan kedua ruas dengan 5.",steps:["Konstanta −2 dihapus dengan menambah 2 di kedua ruas.","(1/5)x = 4 + 2 = 6 (kotak 1).","Kalikan kedua ruas dengan 5: x = 30 (kotak 2).","Jadi, x = 30."],var:"x"},{id:"L6-08",kind:"steps",ind:"formulate",label:"Pembilang Aljabar",eq:"(2x - 1)/3 = 5",prompt:["Selesaikan persamaan (2x − 1)/3 = 5:"],boxes:[{text:"Kalikan kedua ruas dengan 3: 2x − 1 = □",answer:"15"},{text:"Nilai x = □",answer:"8"}],clue:"Penyebutnya 3. Kalikan kedua ruas dengan 3.",step:"Setelah 2x − 1 = 15, tambah 1 lalu bagi 2.",steps:["Diketahui (2x − 1)/3 = 5.","Penyebut = 3.","Kalikan 3: 2x − 1 = 15.","Tambah 1: 2x = 16.","Bagi 2: x = 8.","Jadi, x = 8."],var:"x"},{id:"L6-09",kind:"steps",ind:"formulate",label:"Isian KPK Bertahap",eq:"x/2 + x/3 = 10",prompt:["Selesaikan (x/2) + (x/3) = 10 pelan-pelan:"],boxes:[{text:"KPK dari 2 dan 3 adalah: □",answer:"6"},{text:"Kalikan KPK sehingga menjadi: □x + □x = □",answer:["3","2","60"]},{text:"Nilai x = □",answer:"12"}],clue:"Bilangan terkecil berapa yang habis dibagi 2 dan 3?",step:"Kalikan setiap suku dengan 6: 6(x/2) + 6(x/3) = 6(10).",steps:["Penyebut 2 dan 3.","KPK = 6.","Kalikan tiap suku dengan 6: 6(x/2) + 6(x/3) = 6(10).","3x + 2x = 60.","5x = 60 → x = 12.","Jadi, x = 12."],var:"x"},{id:"L6-10",kind:"steps",ind:"reason",label:"Pecahan di Kedua Ruas",eq:"(x + 2)/3 = (x - 1)/2",prompt:["Tentukan nilai m yang memenuhi (m + 2)/3 = (m − 1)/2!","Bentuk tanpa pecahan (kali KPK 6): 2(m + 2) = 3(m − 1)"],boxes:[{text:"Nilai m = □",answer:"7"}],clue:"Jabarkan kedua kurung, lalu kumpulkan suku m.",step:"Kurangi 3m dan 4 pada kedua ruas: −m = −7.",steps:["Penyebut 3 dan 2 hilang serentak dengan dikali KPK 6.","2(m + 2) = 3(m − 1) → 2m + 4 = 3m − 3.","2m − 3m = −3 − 4 → −m = −7 → m = 7.","Isian m = 7.","Cek: (7 + 2)/3 = 3 dan (7 − 1)/2 = 3."],var:"m"}]},{id:"L7",code:"K-07",title:"Kasus Penyelidikan Lapangan Akhir",form:"soal cerita",badge:"Master Detective",briefing:["Kasus terakhir ada di dunia nyata.","Baca bukti, tentukan variabel, susun SPLSV, lalu nilai hasilnya."],twin:["Contoh sejenis: 3 buku dan 1 tas seharga Rp50.000. Harga tas Rp20.000.","Misal harga buku = b: 3b + 20.000 = 50.000","Kurangi 20.000 di kedua ruas: 3b = 30.000 → b = 10.000","Cek: 3 × 10.000 + 20.000 = 50.000 ✓"],items:[{id:"L7-01",kind:"mc",ind:"reason",label:"Memilih Paket Sewa Futsal",prompt:["Pengurus OSIS memiliki anggaran Rp340.000 untuk menyewa lapangan futsal minimal 4 jam:","• Gelanggang A: Rp85.000/jam.","• Gelanggang B: admin Rp40.000 + Rp75.000/jam.","• Gelanggang C: paket 4 jam Rp320.000.","Keputusan terbaik berdasarkan penyelesaian SPLSV durasi maksimal adalah ...."],options:["Gelanggang A karena tanpa biaya admin.","Gelanggang B karena tarif per jam paling murah.","Gelanggang C karena mendapat 4 jam dengan biaya Rp320.000.","Gelanggang A atau B karena menghabiskan tepat Rp340.000."],answer:2,clue:"Misal x = lama sewa. Berapa jam maksimal di tiap tempat?",step:"A: 85.000x = 340.000. B: 75.000x + 40.000 = 340.000. Bandingkan dengan C.",steps:["Anggaran Rp340.000, minimal 4 jam. Misal x = lama sewa.","A: 85.000x = 340.000 → x = 4. B: 75.000x + 40.000 = 340.000 → x = 4. C: 4 jam = Rp320.000.","Untuk 4 jam: Rp320.000 < Rp340.000.","Pilih Gelanggang C.","Durasi sama 4 jam, tetapi C lebih hemat Rp20.000."]},{id:"L7-02",kind:"mc",ind:"formulate",label:"Bantuan Paket Sembako",eq:"120000x + 650000 = 4250000",prompt:["Komunitas sosial mengumpulkan dana Rp4.250.000.","Sebesar Rp650.000 dipakai untuk operasional dan sisanya dibelikan p paket sembako seharga Rp120.000/paket.","Model SPLSV dan hasil p yang tepat adalah ...."],options:["120.000p − 650.000 = 4.250.000; p = 40","120.000p + 650.000 = 4.250.000; p = 30","650.000p + 120.000 = 4.250.000; p = 6","120.000(p + 650.000) = 4.250.000; p = 35"],answer:1,clue:"Biaya paket ditambah biaya operasional sama dengan apa?",step:"Model: 120.000p + 650.000 = 4.250.000. Kurangi 650.000 di kedua ruas.",steps:["Dana Rp4.250.000, operasional Rp650.000, harga paket Rp120.000.","Variabel p = banyak paket.","Biaya paket + operasional = total dana.","Model: 120.000p + 650.000 = 4.250.000.","120.000p = 3.600.000 → p = 30.","Jadi, jawabannya B."],var:"p"},{id:"L7-03",kind:"mc",ind:"formulate",label:"Tabungan Sepeda Rendi",eq:"75000x + 500000 = 1850000",prompt:["Rendi ingin membeli sepeda seharga Rp1.850.000.","Ia sudah memiliki tabungan awal Rp500.000 dan menabung Rp75.000 setiap minggu selama m minggu.","Model SPLSV yang sesuai adalah ...."],options:["75.000m − 500.000 = 1.850.000","500.000m + 75.000 = 1.850.000","75.000m + 500.000 = 1.850.000","75.000(m + 500.000) = 1.850.000"],answer:2,clue:"Bagian mana yang bertambah tiap minggu? Itu yang dikali m.",step:"Total tabungan = setoran m minggu + tabungan awal.",steps:["Harga sepeda Rp1.850.000, tabungan awal Rp500.000, setoran Rp75.000/minggu.","Variabel m = banyak minggu.","Total = setoran m minggu + tabungan awal.","Model: 75.000m + 500.000 = 1.850.000.","75.000m = 1.350.000 → m = 18 minggu.","Jadi, jawabannya C."],var:"m"},{id:"L7-04",kind:"mc",ind:"employ",label:"Potongan Pita Dekorasi",eq:"x + (x + 15) + 2x = 150",prompt:["Seutas pita 150 cm dipotong menjadi 3 bagian.","Bagian kedua 15 cm lebih panjang dari bagian pertama, dan bagian ketiga dua kali panjang bagian pertama.","Panjang pita terpanjang adalah ...."],options:["33,75 cm","48,75 cm","67,50 cm","75,00 cm"],answer:2,clue:"Misal bagian pertama x. Tulis bagian kedua dan ketiga dengan x.",step:"x + (x + 15) + 2x = 150 → 4x + 15 = 150.",steps:["Misal bagian 1 = x, bagian 2 = x + 15, bagian 3 = 2x.","4x + 15 = 150 → 4x = 135 → x = 33,75 cm.","Terpanjang (bagian 3): 2x = 67,50 cm.","Jadi, jawabannya C (67,50 cm)."],var:"x"},{id:"L7-05",kind:"mc",ind:"employ",label:"Tiga Bilangan Genap Berurutan",eq:"x + (x + 2) + (x + 4) = 78",prompt:["Jumlah tiga bilangan genap berurutan adalah 78.","Bilangan terbesar dari ketiga bilangan tersebut adalah ...."],options:["24","26","28","30"],answer:2,clue:"Bilangan genap berurutan berselisih 2. Tulis ketiganya dengan x.",step:"x + (x + 2) + (x + 4) = 78 → 3x + 6 = 78.",steps:["Misal bilangannya x, x + 2, x + 4.","3x + 6 = 78 → 3x = 72 → x = 24.","Terbesar: x + 4 = 28.","Jadi, jawabannya C (28)."],var:"x"},{id:"L7-06",kind:"mc",ind:"interpret",label:"Kapasitas Rak Buku",prompt:["Perpustakaan menata 142 buku ke dalam rak berkapasitas maksimal 25 buku.","Dari 25r = 142 diperoleh r = 5,68.","Keputusan yang paling tepat adalah ...."],options:["Menyediakan 5 rak saja.","Menyediakan 6 rak (5 rak penuh, 1 rak isi 17 buku).","Menyediakan 6 rak yang semuanya penuh 25 buku.","Menyediakan 5 rak dan sisa 0,68 buku diletakkan di meja."],answer:1,clue:"Bisakah jumlah rak berupa pecahan? Berapa buku muat di 5 rak?",step:"5 rak memuat 5 × 25 = 125 buku. Sisanya 142 − 125.",steps:["r = 5,68: 5 rak penuh belum menampung semua buku.","5 rak memuat 5 × 25 = 125 buku.","Sisa buku: 142 − 125 = 17.","Sisa 17 buku masuk 1 rak tambahan: 6 rak.","Jumlah rak harus bilangan bulat, dibulatkan ke atas.","Jadi, jawabannya B."]},{id:"L7-07",kind:"steps",ind:"employ",label:"Pagar Kebun Sayur Sekolah",eq:"2((3x + 2) + (2x - 1)) = 42",prompt:["Kebun persegi panjang berukuran panjang (3x + 2) m dan lebar (2x − 1) m dengan keliling 42 m.","Lengka           shown = true;

          var m = document.getElementById('boot-msg');
          var d = document.getElementById('boot-detail');

          if (d) d.textContent = (detail || '') + ' | ' + navigator.userAgent;
