[project]
name = "splsv-research"
version = "1.0.0"
description = "Alat penelitian SPLSV app: mesin persamaan, lembar soal, N-gain, Aiken's V, beban kognitif, analisis log"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
splsv-research = "splsv_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
